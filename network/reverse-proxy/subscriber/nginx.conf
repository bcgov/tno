worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  proxy_temp_path /tmp/proxy_temp;
  client_body_temp_path /tmp/client_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
  '$status $body_bytes_sent "$http_referer" '
  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  #tcp_nopush     on;

  keepalive_timeout 65;

  # Pin each browser to one api pod so SignalR's negotiate and connection requests reach the same pod.
  # The first request has no cookie and hashes on a random id, which is returned as the cookie.
  map $cookie_mmi_api $api_affinity {
    "" $request_id;
    default $cookie_mmi_api;
  }

  map $cookie_mmi_api $api_affinity_cookie {
    "" "mmi_api=$request_id; Path=/api; Secure; HttpOnly; SameSite=Strict";
    default "";
  }

  # A pod that is down refuses connections (its service has no endpoints), so its browsers move to another pod.
  upstream backend {
    hash $api_affinity consistent;

    # statefulset api-0
    server api-0:8080;
    # statefulset api-1
    server api-1:8080;
    # statefulset api-2
    server api-2:8080;
  }

  #gzip  on;

  include /etc/nginx/conf.d/*.conf;
}
