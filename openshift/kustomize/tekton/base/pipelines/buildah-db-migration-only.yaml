apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: database-migration-only
  annotations:
    description: Run the database migration.
spec:
  params:
    - default: latest
      description: The tag given to the built images. Use this to create versioned images.
      name: IMAGE_TAG
      type: string
    - default: dev
      description: Identify the environment to deploy the solution to [dev,test,prod,tools].
      name: DEPLOY_TO
      type: string
    - default: montford
      description: The database server name
      name: SERVER
      type: string
  tasks:
    - name: db-migration
      params:
        - name: DB_SECRET_NAME
          value: crunchy-pguser-admin
        - name: API_NAME
          value: api
        - name: IMAGE
          value: db-migration
        - name: IMAGE_TAG
          value: $(params.IMAGE_TAG)
        - name: DEPLOY
          value: 'yes'
        - name: DEPLOY_TO
          value: $(params.DEPLOY_TO)
        - name: SERVER
          value: $(params.SERVER)
      taskRef:
        kind: Task
        name: db-migration
