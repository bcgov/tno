apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: database-migration
  annotations:
    description: Run the database migration.
spec:
  params:
    - default: dev
      description: The git revision reference to build.
      name: GIT_REF
      type: string
    - default: tno
      description: The root path to the git repo.
      name: CONTEXT
      type: string
    - default: latest
      description: The tag given to the built images. Use this to create versioned images.
      name: IMAGE_TAG
      type: string
    - default: 9b301c
      description: The project namespace shortname. The part before the "-" (i.e. 9b301c-dev = 9b301c).
      name: PROJECT_SHORTNAME
      type: string
    - default: dev
      description: Identify the environment to deploy the solution to [dev,test,prod,tools].
      name: DEPLOY_TO
      type: string
    - default: 'yes'
      description: Whether to force build the migration [yes|no].
      name: FORCE_BUILD
      type: string
    - default: montford
      description: Database server name [montford, montford2, mooncrest, moonstep]
      name: SERVER
      type: string
  tasks:
    - name: wait
      params:
        - name: PIPELINE_NAME
          value: $(context.pipelineRun.name)
      taskRef:
        kind: Task
        name: pipeline-wait
    - name: git
      params:
        - name: GIT_REF
          value: $(params.GIT_REF)
        - name: CONTEXT
          value: $(params.CONTEXT)
      runAfter:
        - wait
      taskRef:
        kind: Task
        name: git-conditions
      workspaces:
        - name: source
          workspace: source
        - name: output
          workspace: conditions
    - name: build-db-migration
      params:
        - name: COMPONENT
          value: db
        - name: CONTEXT
          value: $(params.CONTEXT)/libs/net
        - name: IMAGE
          value: db-migration
        - name: IMAGE_TAG
          value: $(params.IMAGE_TAG)
        - name: BUILD
          value: $(params.FORCE_BUILD)
      runAfter:
        - git
      taskRef:
        kind: Task
        name: build-component
      workspaces:
        - name: source
          workspace: source
        - name: conditions
          workspace: conditions
        - name: build
          workspace: build
    - name: db-migration
      params:
        - name: DB_SECRET_NAME
          value: crunchy-pguser-admin
        - name: API_NAME
          value: api
        - name: IMAGE
          value: db-migration
        - name: IMAGE_TAG
          value: $(params.IMAGE_TAG)
        - name: DEPLOY
          value: $(params.FORCE_BUILD)
        - name: DEPLOY_TO
          value: $(params.DEPLOY_TO)
        - name: SERVER
          value: $(params.SERVER)
      runAfter:
        - build-db-migration
      taskRef:
        kind: Task
        name: db-migration-conditional
      workspaces:
        - name: conditions
          workspace: conditions
  workspaces:
    - description: |
        Git repo source code.
      name: source
    - description: |
        Pipeline configuration file.
      name: conditions
    - description: |
        Pipeline build volume
      name: build
