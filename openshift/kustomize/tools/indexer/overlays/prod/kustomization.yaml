---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: 9b301c-prod

resources:
  - ../../base

generatorOptions:
  disableNameSuffixHash: true

patches:
  # Database credentials: DEV uses the base 'montford' secret; this environment has its own.
  - patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: indexer-service
      spec:
        template:
          spec:
            containers:
              - name: indexer-service
                env:
                  - name: DB_POSTGRES_USERNAME
                    valueFrom:
                      secretKeyRef:
                        name: moonstep
                        key: USERNAME
                  - name: DB_POSTGRES_PASSWORD
                    valueFrom:
                      secretKeyRef:
                        name: moonstep
                        key: PASSWORD
  - target:
      kind: Job
      name: indexer-service
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: image-registry.openshift-image-registry.svc:5000/9b301c-tools/indexer-service:prod
