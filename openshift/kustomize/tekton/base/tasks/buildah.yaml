apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: buildah
  annotations:
    tekton.dev/displayName: Buildah Image
    tekton.dev/pipelines.minVersion: 0.17.0
    tekton.dev/tags: build
    description: |-
      Using Buildah build a new image from source code and push the new image
      to the specified image registry.
  labels:
    component: task
    managed-by: kustomize
    name: buildah
    part-of: tno
    version: 1.0.0
spec:
  params:
    - default: .
      description: Path to the source code to build.
      name: CONTEXT
      type: string
    - default: ./Dockerfile
      description: Path to the Dockerfile to build.
      name: DOCKERFILE
      type: string
    - default: bcgov-c4awhwfpcremdbga.azurecr.io
      description: The Root url of the image registry.
      name: IMAGE_REGISTRY
      type: string
    - description: Reference of the image buildah will produce.
      name: IMAGE
      type: string
    - default: latest
      description: The tag given to the built image.
      name: IMAGE_TAG
      type: string
    - default: vfs
      description: Set buildah storage driver
      name: STORAGE_DRIVER
      type: string
  steps:
    - computeResources:
        limits:
          cpu: '2'
          memory: 7Gi
        requests:
          cpu: '1'
          memory: 4Gi
      env:
        - name: IMAGE_REGISTRY_USER
          valueFrom:
            secretKeyRef:
              key: username
              name: pipelines
        - name: IMAGE_REGISTRY_PASS
          valueFrom:
            secretKeyRef:
              key: password
              name: pipelines
      image: bcgov-c4awhwfpcremdbga.azurecr.io/buildah:latest
      name: build
      script: |
        #!/usr/bin/env bash
        set -xe

        # export TMPDIR="$(workspaces.source.path)/tmp/buildah"
        # mkdir -p "${TMPDIR}"

        if [ ! -z "$IMAGE_REGISTRY_USER" ];  then
          buildah login \
            -u $IMAGE_REGISTRY_USER \
            -p $IMAGE_REGISTRY_PASS $(params.IMAGE_REGISTRY) > /dev/null
        fi

        # Build the image.
        buildah --storage-driver=$(params.STORAGE_DRIVER) bud \
          --no-cache -f $(params.DOCKERFILE) -t $(params.IMAGE_REGISTRY)/$(params.IMAGE):$(params.IMAGE_TAG) --isolation chroot $(params.CONTEXT)

        # Push the image to the registry.
        buildah --storage-driver=$(params.STORAGE_DRIVER) push $(params.IMAGE_REGISTRY)/$(params.IMAGE):$(params.IMAGE_TAG)
      securityContext:
        capabilities:
          add:
            - SETFCAP
        runAsUser: 0
      workingDir: $(workspaces.source.path)
  workspaces:
    - name: source
    - mountPath: /var/lib/containers/storage/vfs/dir
      name: build
