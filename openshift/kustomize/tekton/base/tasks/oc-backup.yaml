apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: oc-backup
  annotations:
    tekton.dev/displayName: openshift client
    tekton.dev/pipelines.minVersion: 0.12.1
    tekton.dev/tags: cli
    description: This task makes a remote SSH connection to the database backup service and starts a backup.
  labels:
    app.kubernetes.io/version: '0.1'
    operator.tekton.dev/provider-type: redhat
spec:
  description: This task makes a remote SSH connection to the database backup service and starts a backup.
  params:
    - default: 9b301c-dev
      description: The project namespace to run the database backup in.
      name: PROJECT_NAMESPACE
      type: string
    - description: The name of the DeploymentConfig that is running the database backup service.
      name: DEPLOYMENT_CONFIG
      type: string
    - default: '-1'
      description: 'The arguments to include when executing the backup.sh script. -l : List existing backups -h : Display help information -c : Display current configuration -1 : Run a single backup -r <spec> : Restore the database with the specified <spec>'
      name: ARGS
      type: string
  steps:
    - computeResources: {}
      image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
      name: build
      script: |
        echo "Running Database Backup" set -xe
        oc rsh -n $(params.PROJECT_NAMESPACE) dc/$(params.DEPLOYMENT_CONFIG) bash -c './backup.sh $(params.ARGS)'
