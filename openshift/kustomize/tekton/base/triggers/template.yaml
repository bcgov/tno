apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: git-app
spec:
  params:
    - description: Identify the git source
      name: GIT_SOURCE
    - description: Identify the git commit
      name: GIT_REF
    - description: The version to tag the image with
      name: VERSION
    - description: The environment to deploy to
      name: DEPLOY_TO
    - description: Which components to build/deploy [*|all|[name]]
      name: COMPONENT
  resourcetemplates:
    - apiVersion: tekton.dev/v1beta1
      kind: PipelineRun
      metadata:
        annotations:
          description: Build an docker image from a GIT repository using an existing BuildConfig. Then deploy to the specified environment.
          tags: oc,git,docker,build,deploy
        generateName: buildah-all-$(tt.params.VERSION)-
        labels:
          component: pipeline
          managed-by: kustomize
          name: buildah-all-$(tt.params.VERSION)
          part-of: tno
          tekton.dev/pipeline: buildah-all
          version: $(tt.params.VERSION)
      spec:
        params:
          - name: GIT_SOURCE
            value: $(tt.params.GIT_SOURCE)
          - name: GIT_REF
            value: $(tt.params.GIT_REF)
          - name: IMAGE_TAG
            value: $(tt.params.VERSION)
          - name: CONTEXT
            value: tno
          - name: DEPLOY_TO
            value: $(tt.params.DEPLOY_TO)
          - name: COMPONENT
            value: $(tt.params.COMPONENT)
        pipelineRef:
          name: buildah-all
        serviceAccountName: pipeline
        timeout: 2h0m0s
        workspaces:
          - name: source
            persistentVolumeClaim:
              claimName: repo
          - name: conditions
            volumeClaimTemplate:
              spec:
                accessModes:
                  - ReadWriteOnce
                resources:
                  requests:
                    storage: 50Mi
                storageClassName: netapp-file-standard
                volumeMode: Filesystem
          - emptyDir: {}
            name: build
          - emptyDir: {}
            name: owasp-settings
