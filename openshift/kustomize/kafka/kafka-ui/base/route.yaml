kind: Route
apiVersion: route.openshift.io/v1
metadata:
  name: kafka-ui
  namespace: default
  annotations:
    haproxy.router.openshift.io/ip_whitelist: 127.0.0.1/32
  labels:
    name: kafka-ui
    part-of: tno
    version: 1.0.0
    component: kafka-ui
    managed-by: kustomize
    created-by: jeremy.foster
spec:
  host: kafka-ui-dev.apps.silver.devops.gov.bc.ca
  port:
    targetPort: 8080-tcp
  tls:
    insecureEdgeTerminationPolicy: Redirect
    termination: edge
  to:
    kind: Service
    name: kafka-ui
    weight: 100
