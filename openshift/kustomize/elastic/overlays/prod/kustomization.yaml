---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: 9b301c-prod

# PROD runs on Elastic Cloud and this StatefulSet is scaled to 0 (its volumes are kept). The base image
# follows Local and DEV, so pin the tag this overlay rendered before they moved to 9.5.7: applying the overlay
# must not change the dormant StatefulSet's version. Upgrading it is a separate decision.
images:
  - name: docker.elastic.co/elasticsearch/elasticsearch
    newTag: 8.19.21

resources:
  - ../../base

generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  - name: elastic
    type: stringData
    env: secret.env

# Add the following files to this folder
# They should contain the tls routes with the certificate information.
patchesStrategicMerge:
  - route.env

patches:
  - target:
      kind: Route
      name: elastic
    patch: |-
      - op: replace
        path: /spec/host
        value: mmi.gov.bc.ca
  - target:
      kind: StatefulSet
      name: elastic
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0  # Elasticsearch Cloud is primary; retain local PVCs.
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 100m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 2Gi
      - op: add
        path: /spec/template/spec/containers/0/resources/limits
        value:
          cpu: 200m
          memory: 3Gi
