apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: git-webhook-master
  annotations:
    component: app
spec:
  namespaceSelector: {}
  resources: {}
  serviceAccountName: pipeline
  triggers:
    - bindings:
        - kind: TriggerBinding
          ref: git-test
      interceptors:
        - params:
            - name: secretRef
              value:
                secretKey: webhook
                secretName: tno-webhook
            - name: eventTypes
              value:
                - push
          ref:
            kind: ClusterInterceptor
            name: github
        - params:
            - name: filter
              # GitHub Actions owns automatic releases. Tekton is manual fallback only.
              value: 'false'
            - name: overlays
              value: null
          ref:
            kind: ClusterInterceptor
            name: cel
      name: github-listener
      template:
        ref: git-app
