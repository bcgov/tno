apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-pull
  annotations:
    tekton.dev/displayName: Git Pull
    tekton.dev/pipelines.minVersion: 0.17.0
    tekton.dev/tags: git
    description: |-
      Update the git repo in the shared workspace with the latest commits for the
      specified branch reference.
  labels:
    component: task
    managed-by: kustomize
    name: git-pull
    part-of: tno
    version: 1.0.0
spec:
  params:
    - default: dev
      description: Git reference or branch to build from.
      name: GIT_REF
      type: string
    - default: .
      description: Path to the source code to build.
      name: CONTEXT
      type: string
  steps:
    - computeResources:
        limits:
          cpu: 100m
          memory: 500Mi
        requests:
          cpu: 50m
          memory: 100Mi
      image: bitnami/git:latest
      name: git-pull
      script: |
        #!/usr/bin/env bash
        set -xe
        pwd

        # Update the git repo with the latest commit.
        git config --global --add safe.directory '*'
        git checkout $(params.GIT_REF)
        #git fetch origin
        #git reset --hard origin/$(params.GIT_REF)
        git pull
      workingDir: $(workspaces.source.path)/$(params.CONTEXT)
  workspaces:
    - name: source
