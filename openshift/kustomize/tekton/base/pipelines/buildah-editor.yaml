apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: buildah-editor
  annotations:
    tekton.dev/displayName: Buildah Pipeline
    tekton.dev/pipelines.minVersion: 0.17.0
    tekton.dev/tags: build deploy
  labels:
    component: pipeline
    managed-by: kustomize
    name: buildah-editor
    part-of: tno
    version: 1.0.0
spec:
  params:
    - default: dev
      description: The git revision reference to build.
      name: GIT_REF
      type: string
    - default: tno
      description: The root path to the git repo.
      name: CONTEXT
      type: string
    - default: latest
      description: The tag given to the built images. Use this to create versioned images.
      name: IMAGE_TAG
      type: string
    - default: 9b301c
      description: The project namespace shortname. The part before the "-" (i.e. 9b301c-dev = 9b301c).
      name: PROJECT_SHORTNAME
      type: string
    - default: 'yes'
      description: Whether to force build the app [yes|no].
      name: FORCE_BUILD
      type: string
    - default: dev
      description: Identify the environment to deploy the solution to [dev,test,prod,tools].
      name: DEPLOY_TO
      type: string
    - default: https://tno-dev.apps.silver.devops.gov.bc.ca
      description: The URL to the web application that will be ZAP scanned.
      name: EDITOR_URL
      type: string
  tasks:
    - name: wait
      params:
        - name: PIPELINE_NAME
          value: $(context.pipelineRun.name)
      taskRef:
        kind: Task
        name: pipeline-wait
    - name: git
      params:
        - name: GIT_REF
          value: $(params.GIT_REF)
        - name: CONTEXT
          value: $(params.CONTEXT)
      runAfter:
        - wait
      taskRef:
        kind: Task
        name: git-conditions
      workspaces:
        - name: source
          workspace: source
        - name: output
          workspace: conditions
    - name: build-editor
      params:
        - name: COMPONENT
          value: editor
        - name: CONTEXT
          value: $(params.CONTEXT)/app/editor
        - name: DOCKERFILE
          value: Dockerfile.open
        - name: IMAGE
          value: editor
        - name: IMAGE_TAG
          value: $(params.IMAGE_TAG)
        - name: BUILD
          value: $(params.FORCE_BUILD)
      runAfter:
        - git
      taskRef:
        kind: Task
        name: build-component
      workspaces:
        - name: source
          workspace: source
        - name: conditions
          workspace: conditions
        - name: build
          workspace: build
    - name: maintenance-on
      params:
        - name: PROJECT
          value: $(params.PROJECT_SHORTNAME)-$(params.DEPLOY_TO)
        - name: ROUTE
          value: editor
        - name: SERVICE
          value: nginx
      runAfter:
        - build-editor
      taskRef:
        kind: Task
        name: oc-patch-route
    - name: deploy-editor
      params:
        - name: PROJECT_SHORTNAME
          value: $(params.PROJECT_SHORTNAME)
        - name: IMAGE
          value: editor
        - name: IMAGE_TAG
          value: $(params.IMAGE_TAG)
        - name: ENV
          value: $(params.DEPLOY_TO)
      runAfter:
        - maintenance-on
      taskRef:
        kind: Task
        name: oc-deploy-with-tag
    - name: maintenance-off
      params:
        - name: PROJECT
          value: $(params.PROJECT_SHORTNAME)-$(params.DEPLOY_TO)
        - name: ROUTE
          value: editor
        - name: SERVICE
          value: editor
      runAfter:
        - deploy-editor
      taskRef:
        kind: Task
        name: oc-patch-route
    - name: owasp-scan
      params:
        - name: TARGET_URL
          value: $(params.EDITOR_URL)
        - name: SCAN_TYPE
          value: quick
        - name: SCAN_DURATION
          value: '1'
      runAfter:
        - maintenance-off
      taskRef:
        kind: Task
        name: owasp-scanner
      workspaces:
        - name: owasp-settings
          workspace: owasp-settings
  workspaces:
    - description: |
        Git repo source code.
      name: source
    - description: |
        Pipeline configuration file.
      name: conditions
    - description: |
        Pipeline build volume
      name: build
    - description: |
        mounts /zap/wrk to store generated configs and results.
      name: owasp-settings
