name: Reusable Elastic Migration CD

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      writers_paused:
        required: true
        type: boolean
      baseline:
        required: false
        type: string
        default: ''
      image_tag:
        required: true
        type: string
      openshift_namespace:
        required: true
        type: string
      db_secret_name:
        required: true
        type: string
      elastic_secret_name:
        required: true
        type: string
      indexing_configmap:
        required: true
        type: string
      elastic_apikey_enabled:
        required: false
        type: boolean
        default: false
    secrets:
      OPENSHIFT_TOKEN:
        required: true
      ACR_USERNAME:
        required: true
      ACR_PASSWORD:
        required: true

env:
  OPENSHIFT_SERVER: https://api.silver.devops.gov.bc.ca:6443
  OPENSHIFT_TOOLS_NAMESPACE: 9b301c-tools
  ACR_URL: bcgov-c4awhwfpcremdbga.azurecr.io
  IMAGE_NAME: elastic-migration

jobs:
  migrate:
    name: Run Elastic Migration
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 350
    steps:
      - name: Require maintenance window
        env:
          WRITERS_PAUSED: ${{ inputs.writers_paused }}
          BASELINE: ${{ inputs.baseline }}
        run: |
          [[ "$WRITERS_PAUSED" == "true" ]] || { echo "Pause all database/index writers first; see tools/elastic/migration/README.md."; exit 1; }
          [[ -z "$BASELINE" || "$BASELINE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1

      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -f tools/elastic/migration/Dockerfile \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            .

      - name: Trivy Container Scan
        uses: ./.github/actions/trivy-scan
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ github.sha }}'

      - name: Install oc CLI
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: latest

      - name: Login to OpenShift
        uses: ./.github/actions/openshift-login
        with:
          token: ${{ secrets.OPENSHIFT_TOKEN }}
          server: ${{ env.OPENSHIFT_SERVER }}

      - name: Login to ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ env.ACR_URL }} \
            -u ${{ secrets.ACR_USERNAME }} \
            --password-stdin

      - name: Backup current image tag
        continue-on-error: true
        run: |
          echo "Backing up ${{ env.IMAGE_NAME }}:${{ inputs.image_tag }} → ${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}-backup"
          docker pull ${{ env.ACR_URL }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }} && \
          docker tag \
            ${{ env.ACR_URL }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }} \
            ${{ env.ACR_URL }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}-backup && \
          docker push \
            ${{ env.ACR_URL }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}-backup

      - name: Push Image to ACR
        run: |
          docker tag \
            ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            ${{ env.ACR_URL }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}
          docker push \
            ${{ env.ACR_URL }}/${{ env.IMAGE_NAME }}:${{ inputs.image_tag }}

      # Use the same validated Job, authentication references, and recovery behavior as the CLI.
      # Route maintenance alone does not stop writers. Operators own pause/resume and keep writers
      # paused after any failure, including a GitHub runner timeout while an ES task continues.
      - name: Run migration Job
        env:
          TARGET_ENV: ${{ inputs.environment }}
          SOURCE_TAG: ${{ inputs.image_tag }}
          DB_SECRET: ${{ inputs.db_secret_name }}
          ELASTIC_MIGRATION_WRITERS_PAUSED: ${{ inputs.writers_paused }}
          ELASTIC_MIGRATION_BASELINE: ${{ inputs.baseline }}
          ELASTIC_MIGRATION_CONFIGMAP: ${{ inputs.indexing_configmap }}
          ELASTIC_MIGRATION_SECRET: ${{ inputs.elastic_secret_name }}
          ELASTIC_MIGRATION_AUTH: ${{ inputs.elastic_apikey_enabled && 'apikey' || 'basic' }}
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: make -C openshift deploy n=elastic-migration e="$TARGET_ENV" t="$SOURCE_TAG" s="$DB_SECRET"
