# Kafka topic settings for the local Docker broker (make kafka-update).
# Variables exported before running, or command line options, override these.
KAFKA_TARGET=docker
KAFKA_CONTAINER=tno-broker
KAFKA_BOOTSTRAP=broker:29092
KAFKA_PARTITIONS=1
KAFKA_REPLICATION_FACTOR=1

# Configuration applied to every topic (comma-separated key=value), e.g. retention.ms=604800000
# KAFKA_TOPIC_CONFIG=

# Per-topic overrides (topic upper-cased, '-' and '.' become '_'):
# KAFKA_TOPIC_ANALYSIS_PARTITIONS=1
# KAFKA_TOPIC_ANALYSIS_DLQ_CONFIG=retention.ms=2592000000
