# Elasticsearch snapshots: a shared volume mounted on every node and registered with path.repo.
# Register the repository and the snapshot lifecycle policy with ../../scripts/snapshots.sh.
# See ../../SNAPSHOTS.md.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - pvc.yaml

patches:
  - target:
      kind: StatefulSet
      name: elastic
    patch: |-
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: snapshots
          persistentVolumeClaim:
            claimName: elastic-snapshots
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: snapshots
          mountPath: /usr/share/elasticsearch/snapshots
      # The Elasticsearch image turns lowercase dotted environment variables into settings.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: path.repo
          value: /usr/share/elasticsearch/snapshots
