name: Elastic Migration CI/CD

on:
  push:
    branches: [dev, master]
    paths:
      - 'src/tools/elastic/**'
      - 'src/libs/**'
      - 'dependencies/elasticsearch/**'
      - '.github/workflows/elastic-migration-cicd.yml'
  pull_request:
    branches: [dev, master]
    paths:
      - 'src/tools/elastic/**'
      - 'src/libs/**'
      - 'dependencies/elasticsearch/**'
      - '.github/workflows/elastic-migration-cicd.yml'
  workflow_dispatch:

concurrency:
  group: elastic-migration-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  security-events: write

jobs:
  ci:
    name: CI — Validate (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        # 8.19.25: the version Local and DEV are upgraded from. No job tests the versions Elastic Cloud runs
        #          today: TEST 8.19.26 and PROD 8.19.21.
        # 9.5.5:   the version the business named for the Elastic Cloud upgrade. PROD (8.19.21) can move to it.
        #          TEST cannot: 9.5.5 was released before 8.19.26, and Elastic only supports upgrading to a
        #          release published after the one that is running.
        # 9.5.7:   the Local and DEV target.
        # 7.17 is no longer tested: no environment runs it.
        # Which versions to test for TEST and PROD is an open decision; the list is unchanged until it is made.
        elasticsearch: ['8.19.25', '9.5.5', '9.5.7']
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:${{ matrix.elasticsearch }}
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          # Disposable test data only; host disk usage must not prevent tiny clone fixtures.
          cluster.routing.allocation.disk.threshold_enabled: 'false'
          ES_JAVA_OPTS: '-Xms512m -Xmx512m'
        ports:
          - 19274:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health"
          --health-interval 10s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: migration-test-only
        ports:
          - 15439:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x

      - name: Restore
        run: dotnet restore "src/tools/elastic/TNO.Elastic.sln" --configfile NuGet.Config

      - name: Build Migration Tool
        run: dotnet build "src/tools/elastic/migration/TNO.Elastic.Migration.csproj" --configuration Release --no-restore

      - name: Test native migration and database reconciliation
        env:
          MMI_ELASTIC_TEST_URL: http://127.0.0.1:19274
          MMI_MIGRATION_TEST_POSTGRES: Host=127.0.0.1;Port=15439;Database=postgres;Username=postgres;Password=migration-test-only
        run: dotnet test src/tools/elastic/tests/ --configuration Release

      - name: Test deployment scripts
        run: python3 -m unittest discover -s openshift/scripts/tests -v

  # The image is built and pushed for the migration Job to use; the migration itself is never run
  # here. Run it with 'make -C openshift deploy n=elastic-migration ...' (see the elastic-migration README).
  cd-dev:
    name: CD — Build Dev Image
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && github.repository == 'bcgov/tno'
    environment: dev
    steps:
      - uses: actions/checkout@v7

      - name: Build, scan, and push image
        uses: ./.github/actions/build-scan-push-image
        with:
          image_name: elastic-migration
          dockerfile: src/tools/elastic/migration/Dockerfile
          context: .
          source_tag: ${{ github.sha }}
          image_tag: dev
          acr_url: bcgov-c4awhwfpcremdbga.azurecr.io
          acr_username: ${{ secrets.ACR_USERNAME }}
          acr_password: ${{ secrets.ACR_PASSWORD }}

  cd-test:
    name: CD — Build Test Image
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && github.repository == 'bcgov/tno'
    environment: test
    steps:
      - uses: actions/checkout@v7

      - name: Build, scan, and push image
        uses: ./.github/actions/build-scan-push-image
        with:
          image_name: elastic-migration
          dockerfile: src/tools/elastic/migration/Dockerfile
          context: .
          source_tag: ${{ github.sha }}
          image_tag: test
          acr_url: bcgov-c4awhwfpcremdbga.azurecr.io
          acr_username: ${{ secrets.ACR_USERNAME }}
          acr_password: ${{ secrets.ACR_PASSWORD }}
