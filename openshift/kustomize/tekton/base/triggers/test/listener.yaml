apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: git-webhook-master
  annotations:
    component: app
spec:
  namespaceSelector: {}
  resources: {}
  serviceAccountName: pipeline
  triggers:
    - bindings:
        - kind: TriggerBinding
          ref: git-test
      interceptors:
        - params:
            - name: secretRef
              value:
                secretKey: webhook
                secretName: tno-webhook
            - name: eventTypes
              value:
                - push
          ref:
            kind: ClusterInterceptor
            name: github
        - params:
            - name: filter
              value: |-
                body.ref == 'refs/heads/master' && (body.commits.exists(c, c.added.exists(m, m.startsWith('src/app/')))
                  || body.commits.exists(c, c.modified.exists(m, m.startsWith('src/app/')))
                  || body.commits.exists(c, c.removed.exists(m, m.startsWith('src/app/')))
                  || body.head_commit.added.exists(m, m.startsWith('src/app/'))
                  || body.head_commit.modified.exists(m, m.startsWith('src/app/'))
                  || body.head_commit.removed.exists(m, m.startsWith('src/app/'))

                  || body.commits.exists(c, c.added.exists(m, m.startsWith('src/api')))
                  || body.commits.exists(c, c.modified.exists(m, m.startsWith('src/api')))
                  || body.commits.exists(c, c.removed.exists(m, m.startsWith('src/api')))
                  || body.head_commit.added.exists(m, m.startsWith('src/api'))
                  || body.head_commit.modified.exists(m, m.startsWith('src/api'))
                  || body.head_commit.removed.exists(m, m.startsWith('src/api'))

                  || body.commits.exists(c, c.added.exists(m, m.startsWith('src/libs')))
                  || body.commits.exists(c, c.modified.exists(m, m.startsWith('src/libs')))
                  || body.commits.exists(c, c.removed.exists(m, m.startsWith('src/libs')))
                  || body.head_commit.added.exists(m, m.startsWith('src/libs'))
                  || body.head_commit.modified.exists(m, m.startsWith('src/libs'))
                  || body.head_commit.removed.exists(m, m.startsWith('src/libs'))

                  || body.commits.exists(c, c.added.exists(m, m.startsWith('src/tools/elastic')))
                  || body.commits.exists(c, c.modified.exists(m, m.startsWith('src/tools/elastic')))
                  || body.commits.exists(c, c.removed.exists(m, m.startsWith('src/tools/elastic')))
                  || body.head_commit.added.exists(m, m.startsWith('src/tools/elastic'))
                  || body.head_commit.modified.exists(m, m.startsWith('src/tools/elastic'))
                  || body.head_commit.removed.exists(m, m.startsWith('src/tools/elastic'))

                  || body.commits.exists(c, c.added.exists(m, m.startsWith('src/services')))
                  || body.commits.exists(c, c.modified.exists(m, m.startsWith('src/services')))
                  || body.commits.exists(c, c.removed.exists(m, m.startsWith('src/services')))
                  || body.head_commit.added.exists(m, m.startsWith('src/services'))
                  || body.head_commit.modified.exists(m, m.startsWith('src/services'))
                  || body.head_commit.removed.exists(m, m.startsWith('src/services')))
            - name: overlays
              value: null
          ref:
            kind: ClusterInterceptor
            name: cel
      name: github-listener
      template:
        ref: git-app
