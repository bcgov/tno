# Shared by both designs; $design is _editor or _subscriber.
# Web root: files common to both designs, hashed build output in /static/, Monaco in /monaco/, and
# each design's own files (document, favicon, manifest, assets) in /_editor/ and /_subscriber/,
# which are served as an overlay so every URL keeps the meaning it had for that design.
listen 8080;
server_name localhost;
root /usr/share/nginx/html;

location = /nginx-status {
  stub_status on;
  allow all;
  access_log off;
  default_type text/plain;
  return 200 "healthy\n";
}

# The overlays are reached only through try_files below, never directly.
location ~ ^/_(editor|subscriber)(/|$) {
  internal;
  gzip on;
  gzip_min_length 1000;
  gzip_types *;
  sendfile off;
  expires -1;
}

# Content-hashed build output can be cached indefinitely.
location /static/ {
  try_files $uri =404;
  expires 1y;
  add_header Cache-Control "public, immutable";
  gzip on;
  gzip_min_length 1000;
  gzip_types *;
}

location = / {
  try_files /$design/index.html =404;
  expires -1;
}

location / {
  try_files /$design$uri $uri /$design/index.html;
  gzip on;
  gzip_min_length 1000;
  gzip_types *;
  sendfile off;
  expires -1;
}

error_page 500 502 503 504 /50x.html;
location = /50x.html {
  root /usr/share/nginx/html;
}
