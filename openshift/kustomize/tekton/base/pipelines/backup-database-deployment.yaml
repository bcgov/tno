apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: backup-database-deployment
  annotations:
    description: Make a remote SSH connection to the database backup service and start a backup. This version works with Kubernetes Deployments (not DeploymentConfigs).
    tags: oc,rsh,database,backup,deployment
spec:
  params:
    - default: 9b301c-dev
      description: The project namespace name.
      name: PROJECT_NAMESPACE
      type: string
    - default: backup
      description: The name of the database backup Deployment.
      name: DEPLOYMENT_NAME
      type: string
    - default: '-1'
      description: 'The arguments to include when executing the backup.sh script. -l : List existing backups -h : Display help information -c : Display current configuration -1 : Run a single backup -r <spec> : Restore the database with the specified <spec>'
      name: ARGS
      type: string
  tasks:
    - name: backup
      params:
        - name: PROJECT_NAMESPACE
          value: $(params.PROJECT_NAMESPACE)
        - name: DEPLOYMENT_NAME
          value: $(params.DEPLOYMENT_NAME)
        - name: ARGS
          value: $(params.ARGS)
      taskRef:
        kind: Task
        name: oc-backup-deployment
