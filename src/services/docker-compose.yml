services:
  ####################### Ingestion Services #######################
  syndication:
    image: tno:syndication
    profiles:
      - all
      - service
    restart: "no"
    container_name: tno-syndication
    build:
      context: ./
      dockerfile: src/services/syndication/Dockerfile
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 250M
        reservations:
          cpus: "0.05"
          memory: 50M
    env_file:
      - src/services/syndication/.env
    ports:
      - ${SYNDICATION_PORT:-40020}:8081
    depends_on:
      - api
      - broker
    networks:
      - tno
    healthcheck:
      test: curl -s -f http://localhost:8081/health || exit 1
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s

