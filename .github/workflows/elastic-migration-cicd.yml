name: Elastic Migration CI/CD

on:
  push:
    branches: [dev, master]
    paths:
      - 'tools/elastic/**'
      - 'libs/net/**'
  pull_request:
    branches: [dev, master]
    paths:
      - 'tools/elastic/**'
      - 'libs/net/**'
  workflow_dispatch:

concurrency:
  group: elastic-migration-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  security-events: write

jobs:
  ci:
    name: CI — Validate (.NET 9)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        elasticsearch: ['7.17.9', '8.19.21']
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:${{ matrix.elasticsearch }}
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          # Disposable test data only; host disk usage must not prevent tiny clone fixtures.
          cluster.routing.allocation.disk.threshold_enabled: 'false'
          ES_JAVA_OPTS: '-Xms512m -Xmx512m'
        ports:
          - 19274:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cluster/health"
          --health-interval 10s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: migration-test-only
        ports:
          - 15439:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.x

      - name: Restore
        run: dotnet restore "tools/elastic/TNO.Elastic.sln" --configfile NuGet.Config

      - name: Build Migration Tool
        run: dotnet build "tools/elastic/migration/TNO.Elastic.Migration.csproj" --configuration Release --no-restore

      - name: Test native migration and database reconciliation
        env:
          MMI_ELASTIC_TEST_URL: http://127.0.0.1:19274
          MMI_MIGRATION_TEST_POSTGRES: Host=127.0.0.1;Port=15439;Database=postgres;Username=postgres;Password=migration-test-only
        run: dotnet test tools/elastic/tests/ --configuration Release

      - name: Test deployment scripts
        run: python3 -m unittest discover -s openshift/scripts/tests -v

  # The image is built and pushed for the migration Job to use; the migration itself is never run
  # here. Run it with 'make -C openshift deploy n=elastic-migration ...' (see the elastic-migration README).
  cd-dev:
    name: CD — Build Dev Image
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/dev' && github.event_name != 'pull_request' && github.repository == 'bcgov/tno'
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Build, scan, and push image
        uses: ./.github/actions/build-scan-push-image
        with:
          image_name: elastic-migration
          dockerfile: tools/elastic/migration/Dockerfile
          context: .
          source_tag: ${{ github.sha }}
          image_tag: dev
          acr_url: bcgov-c4awhwfpcremdbga.azurecr.io
          acr_username: ${{ secrets.ACR_USERNAME }}
          acr_password: ${{ secrets.ACR_PASSWORD }}

  cd-test:
    name: CD — Build Test Image
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && github.repository == 'bcgov/tno'
    environment: test
    steps:
      - uses: actions/checkout@v4

      - name: Build, scan, and push image
        uses: ./.github/actions/build-scan-push-image
        with:
          image_name: elastic-migration
          dockerfile: tools/elastic/migration/Dockerfile
          context: .
          source_tag: ${{ github.sha }}
          image_tag: test
          acr_url: bcgov-c4awhwfpcremdbga.azurecr.io
          acr_username: ${{ secrets.ACR_USERNAME }}
          acr_password: ${{ secrets.ACR_PASSWORD }}
