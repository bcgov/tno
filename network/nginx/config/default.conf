# Docker embedded DNS. Variable upstreams defer lookup until request time, so a
# missing/recreated container affects only its own requests. Refresh cached IPs
# within one second; do not append a URI to proxy_pass (preserve API rewrites).
resolver 127.0.0.11 valid=1s ipv6=off;
resolver_timeout 2s;
proxy_connect_timeout 2s;

server {
  listen       80;
  listen  [::]:80;
  server_name  localhost;
  root   /usr/share/nginx/html/;

  #access_log  /var/log/nginx/host.access.log  main;

  #error_page  404              /404.html;

  # redirect server error pages to the static page /50x.html
  #
  error_page   500 502 503 504  /50x.html;
  location = /50x.html {
    root   /usr/share/nginx/html/;
  }

  location /nginx-status {
    access_log off;
    default_type text/plain;
    return 200 "healthy\n";
  }

  location /api {
    set $api_upstream api:8080;
    client_max_body_size 5120M;
    rewrite /api(.*) $1 break;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Host $server_name;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-NginX-Proxy true;
    proxy_ssl_session_reuse off;
    proxy_set_header Host $http_host;
    proxy_cache_bypass $http_upgrade;
    proxy_pass http://$api_upstream;
    proxy_redirect off;
  }

  location / {
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-NginX-Proxy true;
    proxy_ssl_session_reuse off;
    proxy_set_header Host $http_host;
    proxy_cache_bypass $http_upgrade;
    set $editor_upstream editor:3000;
    proxy_pass http://$editor_upstream;
    proxy_redirect off;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}

server {
  listen       81;
  listen  [::]:81;
  server_name  localhost;
  root   /usr/share/nginx/html/;

  #access_log  /var/log/nginx/host.access.log  main;

