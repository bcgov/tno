---
# The final build image. One image serves both the editor and subscriber designs (APP_MODE).
kind: ImageStream
apiVersion: image.openshift.io/v1
metadata:
  name: app
  annotations:
    description: Destination for built images.
  labels:
    name: app
    part-of: tno
    version: 1.0.0
    component: app
    managed-by: kustomize
    created-by: jeremy.foster

---
# The build config that will be created will be named for the branch you created it for.
kind: BuildConfig
apiVersion: build.openshift.io/v1
metadata:
  name: app.dev
  annotations:
    description: Build image from Dockerfile in git repo.
  labels:
    name: app
    part-of: tno
    version: 1.0.0
    component: app
    managed-by: kustomize
    created-by: jeremy.foster
    branch: dev
spec:
  completionDeadlineSeconds: 2700
  triggers:
    - type: ImageChange
    - type: ConfigChange
  runPolicy: Serial
  source:
    git:
      uri: https://github.com/bcgov/tno.git
      ref: dev
    contextDir: ./app
  strategy:
    type: Docker
    dockerStrategy:
      imageOptimizationPolicy: SkipLayers
      dockerfilePath: Dockerfile.nginx
  output:
    to:
      kind: DockerImage
      name: bcgov-c4awhwfpcremdbga.azurecr.io/app:latest
    pushSecret:
      name: acr-secret
  resources:
    requests:
      cpu: 250m
      memory: 500Mi
    limits:
      cpu: 1500m
      memory: 3Gi
