apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy-all
  annotations:
    description: This task will tag a specific image with the environment name. This will deploy the image if there is a Deployment trigger listening for the environment tag. This version works with Kubernetes Deployments (not DeploymentConfigs).
    tekton.dev/displayName: openshift client
    tekton.dev/pipelines.minVersion: 0.12.1
    tekton.dev/tags: cli
  labels:
    component: task
    managed-by: kustomize
    name: oc-deploy-all
    part-of: tno
    version: 1.0.0
spec:
  params:
    - default: 9b301c
      description: The project namespace.
      name: PROJECT_SHORTNAME
      type: string
    - default: latest
      description: The tag given to the built image.
      name: IMAGE_TAG
      type: string
    - description: The environment to deploy to.
      name: ENV
      type: string
    - default: 600s
      description: The timeout before it will stop waiting for the pod to become available.
      name: TIMEOUT
      type: string
    - default: '*'
      description: Whether to deploy a component, or all [*|all|[name]].
      name: DEPLOY
      type: string
    - default: 'no'
      description: Whether to wait for each service pod to scale back up [yes|no].
      name: WAIT
      type: string
    - default: bcgov-c4awhwfpcremdbga.azurecr.io
      description: The Azure Container Registry URL (leave empty to skip ACR tagging).
      name: ACR_REGISTRY
      type: string
  steps:
    - computeResources: {}
      env:
        - name: IMAGE_REGISTRY_USER
          valueFrom:
            secretKeyRef:
              key: username
              name: pipelines
        - name: IMAGE_REGISTRY_PASS
          valueFrom:
            secretKeyRef:
              key: password
              name: pipelines
      image: bcgov-c4awhwfpcremdbga.azurecr.io/buildah:latest
      name: tag-acr
      script: |
        #!/usr/bin/env bash
        set -e

        if [ -z "$(params.ACR_REGISTRY)" ]; then
          echo "ACR_REGISTRY not set, skipping ACR tagging"
          exit 0
        fi

        if test -f $(workspaces.conditions.path)/build.env; then
          export $(grep -v '^#' $(workspaces.conditions.path)/build.env | xargs)
        else
          echo 'Workspace conditions build.env not found'
          exit 1;
        fi

        CREDS=""
        if [ ! -z "$IMAGE_REGISTRY_USER" ]; then
          echo "Setting up buildah login credentials for $(params.ACR_REGISTRY)"
          CREDS="--creds $IMAGE_REGISTRY_USER:$IMAGE_REGISTRY_PASS"
        fi

        declare -A COMPONENT0=([id]="api" [name]="api" [build]="yes" [env]="dev test prod")
        declare -A COMPONENT2=([id]="charts-api" [name]="charts-api" [build]="yes" [env]="dev test prod")
        declare -A COMPONENT3=([id]="content" [name]="content-service" [build]="yes" [env]="dev test prod")
        declare -A COMPONENT4=([id]="indexing" [name]="indexing-service" [build]="yes" [env]="dev test prod")
        declare -A COMPONENT5=([id]="content-analysis" [name]="content-analysis-service" [build]="yes" [env]="dev test prod")
        declare -A COMPONENT6=([id]="transcription" [name]="transcription-service" [build]="yes" [env]="dev test prod")
        declare -A COMPONENT7=([id]="reporting" [name]="reporting-service" [build]="yes" [env]="dev test prod")
        declare -A COMPONENT8=([id]="notification" [name]="notification-service" [build]="yes" [env]="dev test prod")
        declare -A COMPONENT9=([id]="scheduler" [name]="scheduler-service" [build]="yes" [env]="dev test prod")
        declare -A COMPONENT10=([id]="ffmpeg" [name]="ffmpeg-service" [build]="yes" [env]="dev test prod")
        declare -A COMPONENT11=([id]="event-handler" [name]="event-handler-service" [build]="yes" [env]="dev test prod")
        declare -A COMPONENT12=([id]="ches-retry" [name]="ches-retry-service" [build]="yes" [env]="dev test prod")
        declare -A COMPONENT13=([id]="syndication" [name]="syndication-service" [build]="yes" [env]="dev test prod")
        declare -A COMPONENT14=([id]="filemonitor" [name]="filemonitor-service" [build]="yes" [env]="dev test prod")
        declare -A COMPONENT15=([id]="image" [name]="image-service" [build]="yes" [env]="dev test prod")
        declare -A COMPONENT16=([id]="auto-clipper" [name]="auto-clipper-service" [build]="yes" [env]="dev test prod")
        declare -A COMPONENT17=([id]="folder-collection" [name]="folder-collection-service" [build]="yes" [env]="dev test prod")
        declare -A COMPONENT18=([id]="editor" [name]="editor" [build]="yes" [env]="dev test prod")
        declare -A COMPONENT19=([id]="subscriber" [name]="subscriber" [build]="yes" [env]="dev test prod")
        declare -A COMPONENT20=([id]="nginx-editor" [name]="nginx-editor" [build]="yes" [env]="dev test prod")
        declare -A COMPONENT21=([id]="nginx-subscriber" [name]="nginx-subscriber" [build]="yes" [env]="dev test prod")

        declare -n component;

        for component in ${!COMPONENT@}; do
          TVAR="BUILD_${component[id]}"
          COMPONENT=${TVAR//\-/_}
          COMPONENT=${COMPONENT^^}

          IFS=' ' read -r -a env_array <<< "${component[env]}"

          if [ "${!COMPONENT}" = true ] || [ "$(params.DEPLOY)" = "all" ] || [ "$(params.DEPLOY)" = "${component[id]}" ]; then
            for env in "${env_array[@]}"; do
              if [[ "$env" =~ "$(params.ENV)" ]] && [[ "${component[build]}" = "yes" ]]; then
                echo "Tagging $(params.ACR_REGISTRY)/${component[name]}:$(params.IMAGE_TAG) → :$(params.ENV)"
                IMAGE_ID=$(buildah --storage-driver=vfs pull $CREDS \
                  docker://$(params.ACR_REGISTRY)/${component[name]}:$(params.IMAGE_TAG))
                buildah --storage-driver=vfs tag $IMAGE_ID \
                  $(params.ACR_REGISTRY)/${component[name]}:$(params.ENV)
                buildah --storage-driver=vfs push $CREDS \
                  $(params.ACR_REGISTRY)/${component[name]}:$(params.ENV)
                buildah --storage-driver=vfs rmi --force $IMAGE_ID
              fi
            done
          fi
        done
      securityContext:
        capabilities:
          add:
            - SETFCAP
        runAsUser: 0
      workingDir: $(workspaces.conditions.path)
    - computeResources: {}
      image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
      name: deploy
      script: |
        # set -xe

        # Place config into environment variables.
        if test -f $(workspaces.conditions.path)/build.env; then
          export $(grep -v '^#' $(workspaces.conditions.path)/build.env | xargs)
        else
          echo 'Workspace conditions build.env not found'
          exit 1;
        fi

        # ***************************************************
        # An array of all the objects for the solution.
        # ***************************************************

        # Applications

        declare -A COMPONENT0=(
          [id]="api"
          [name]="api"
          [type]="sts"
          [replicas]="2"
          [action]="stop"
          [build]="yes"
          [env]="dev test prod"
        )

        declare -A COMPONENT1=(
          [id]="charts-api"
          [name]="charts-api"
          [type]="deployment"
          [replicas]="1"
          [action]="maintenance"
          [build]="yes"
          [env]="dev test prod"
        )

        declare -A COMPONENT2=(
          [id]="editor"
          [name]="editor"
          [type]="deployment"
          [replicas]="1"
          [action]="maintenance"
          [build]="yes"
          [env]="dev test prod"
        )

        declare -A COMPONENT3=(
          [id]="subscriber"
          [name]="subscriber"
          [type]="deployment"
          [replicas]="1"
          [action]="maintenance"
          [build]="yes"
          [env]="dev test prod"
        )

        # Processing Services

        declare -A COMPONENT4=(
          [id]="content"
          [name]="content-service"
          [type]="deployment"
          [replicas]="1"
          [action]="stop"
          [build]="yes"
          [env]="dev test prod"
        )

        declare -A COMPONENT5=(
          [id]="content-analysis"
          [name]="content-analysis-service"
          [type]="deployment"
          [replicas]="1"
          [action]="stop"
          [build]="yes"
          [env]="dev test prod"
        )

        declare -A COMPONENT6=(
          [id]="indexing"
          [name]="indexing-service"
          [type]="deployment"
          [replicas]="1"
          [action]="stop"
          [build]="yes"
          [env]="dev test prod"
        )

        declare -A COMPONENT7=(
          [id]="indexing-cloud"
          [name]="indexing-service-cloud"
          [type]="deployment"
          [replicas]="1"
          [action]="stop"
          [build]="no"
          [env]="test prod"
        )

        declare -A COMPONENT8=(
          [id]="transcription"
          [name]="transcription-service"
          [type]="deployment"
          [replicas]="1"
          [action]="stop"
          [build]="yes"
          [env]="dev test prod"
        )

        declare -A COMPONENT9=(
          [id]="reporting"
          [name]="reporting-service"
          [type]="deployment"
          [replicas]="1"
          [action]="stop"
          [build]="yes"
          [env]="dev test prod"
        )

        declare -A COMPONENT10=(
          [id]="notification"
          [name]="notification-service"
          [type]="deployment"
          [replicas]="1"
          [action]="stop"
          [build]="yes"
          [env]="dev test prod"
        )

        declare -A COMPONENT11=(
          [id]="scheduler"
          [name]="scheduler-service"
          [type]="deployment"
          [replicas]="1"
          [action]="stop"
          [build]="yes"
          [env]="dev test prod"
        )

        declare -A COMPONENT12=(
          [id]="folder-collection"
          [name]="folder-collection-service"
          [type]="deployment"
          [replicas]="1"
          [action]="stop"
          [build]="yes"
          [env]="dev test prod"
        )

        declare -A COMPONENT13=(
          [id]="ffmpeg"
          [name]="ffmpeg-service"
          [type]="deployment"
          [replicas]="1"
          [action]="stop"
          [build]="yes"
          [env]="dev test prod"
        )

        declare -A COMPONENT14=(
          [id]="event-handler"
          [name]="event-handler-service"
          [type]="deployment"
          [replicas]="1"
          [action]="stop"
          [build]="yes"
          [env]="dev test prod"
        )

        declare -A COMPONENT15=(
          [id]="ches-retry"
          [name]="ches-retry-service"
          [type]="deployment"
          [replicas]="1"
          [action]="stop"
          [build]="yes"
          [env]="dev test prod"
        )

        # Ingest Services

        declare -A COMPONENT16=(
          [id]="syndication"
          [name]="syndication-service"
          [type]="deployment"
          [replicas]="1"
          [action]="stop"
          [build]="yes"
          [env]="dev test prod"
        )

        declare -A COMPONENT17=(
          [id]="filemonitor"
          [name]="filemonitor-service"
          [type]="deployment"
          [replicas]="1"
          [action]="stop"
          [build]="yes"
          [env]="dev test prod"
        )

        declare -A COMPONENT18=(
          [id]="image"
          [name]="image-service"
          [type]="deployment"
          [replicas]="1"
          [action]="stop"
          [build]="yes"
          [env]="dev test prod"
        )

        declare -A COMPONENT19=(
          [id]="auto-clipper"
          [name]="auto-clipper-service"
          [type]="deployment"
          [replicas]="1"
          [action]="stop"
          [build]="yes"
          [env]="dev test prod"
        )

        # Reverse Proxies

        declare -A COMPONENT20=(
          [id]="nginx-editor"
          [name]="nginx-editor"
          [type]="deployment"
          [replicas]="1"
          [action]="maintenance"
          [build]="yes"
          [env]="dev test prod"
        )

        declare -A COMPONENT21=(
          [id]="nginx-subscriber"
          [name]="nginx-subscriber"
          [type]="deployment"
          [replicas]="1"
          [action]="maintenance"
          [build]="yes"
          [env]="dev test prod"
        )

        declare -n component;

        # ***************************************************
        # Work
        # ***************************************************

        # Stop all services if API needs to be deployed.
        # If the component was auto built by the build step, or all components are to built, or a specific component was requested to be built.
        if [ "${BUILD_API}" = true ] || [ "$(params.DEPLOY)" = "api" ] || [ "$(params.DEPLOY)" = "all" ]; then
          echo "Scale down"
          for component in ${!COMPONENT@}; do
            IFS=' ' read -r -a env_array <<< "${component[env]}"
            for env in "${env_array[@]}"; do
              if [[ "${component[action]}" = "stop" ]] && [[ $env =~ "$(params.ENV)" ]]; then
                echo "Stopping ${component[id]}"
                oc scale ${component[type]} ${component[name]} -n $(params.PROJECT_SHORTNAME)-$(params.ENV) --replicas=0
              fi
            done
          done
        fi

        # Loop through each component and deploy if required.
        for component in ${!COMPONENT@}; do
          # Dynamic variable to control what will be built.
          TVAR="BUILD_${component[id]}"
          COMPONENT=${TVAR//\-/_}
          COMPONENT=${COMPONENT^^}
          echo $COMPONENT=${!COMPONENT}

          IFS=' ' read -r -a env_array <<< "${component[env]}"

          # Check if this image needs to be deployed.
          # If the component was auto built by the build step, or all components are to built, or a specific component was requested to be built.
          if [ "${!COMPONENT}" = true ] || [ "$(params.DEPLOY)" = "all" ] || [ "$(params.DEPLOY)" = "${component[id]}" ]; then
            for env in "${env_array[@]}"; do
              if [[ "$env" =~ "$(params.ENV)" ]]; then
                if [[ "${component[build]}" = "yes" && -z "$(params.ACR_REGISTRY)" ]]; then
                  echo "Tagging image to trigger deployment to ${component[name]}:$(params.ENV)"
                  oc tag ${component[name]}:$(params.IMAGE_TAG) ${component[name]}:$(params.ENV)
                fi

                oc rollout restart ${component[type]}/${component[name]} -n $(params.PROJECT_SHORTNAME)-$(params.ENV)
                echo "Waiting for deployment to roll out"
                oc rollout status --watch --timeout=$(params.TIMEOUT) ${component[type]}/${component[name]} -n $(params.PROJECT_SHORTNAME)-$(params.ENV)
              else
                echo "${component[id]} does not deploy to $(params.ENV)"
              fi
            done
          fi
        done

        # Start all services if API was deployed.
        if [ "${BUILD_API}" = true ] || [ "$(params.DEPLOY)" = "api" ] || [ "$(params.DEPLOY)" = "all" ] || [ "$(params.DEPLOY)" = "${component[id]}" ]; then
          for component in ${!COMPONENT@}; do
            # Dynamic variable to control what will be built.
            TVAR="BUILD_${component[id]}"
            COMPONENT=${TVAR//\-/_}
            COMPONENT=${COMPONENT^^}
            echo $COMPONENT=${!COMPONENT}

            IFS=' ' read -r -a env_array <<< "${component[env]}"

            for env in "${env_array[@]}"; do
              if [[ "${component[action]}" = "stop" ]] && [[ "$env" =~ "$(params.ENV)" ]] && [[ "${component[replicas]}" -gt "0" ]]; then
                echo "Starting ${component[name]}"
                oc scale ${component[type]} ${component[name]} -n $(params.PROJECT_SHORTNAME)-$(params.ENV) --replicas=${component[replicas]}
                # oc rollout status --watch --timeout=$(params.TIMEOUT) ${component[type]}/${component[name]} -n $(params.PROJECT_SHORTNAME)-$(params.ENV)
                if [ "$(params.WAIT)" = "yes" ]; then
                  oc wait --for=condition=available --timeout=$(params.TIMEOUT) ${component[type]}/${component[name]} -n $(params.PROJECT_SHORTNAME)-$(params.ENV)
                fi
              fi
            done
          done
        fi
  workspaces:
    - mountPath: /data
      name: conditions
    - mountPath: /auth
      name: dockerconfig
      optional: true
