name: Deploy OpenShift Workload
description: Apply optional Kustomize manifests and restart/verify an OpenShift workload.

inputs:
  namespace:
    description: OpenShift namespace.
    required: true
  resource_type:
    description: Kubernetes resource kind, such as deployment or statefulset.
    required: false
    default: deployment
  resource_name:
    description: Workload resource name.
    required: true
  rollout_timeout:
    description: Rollout status timeout.
    required: false
    default: 300s
  continue_on_error_verify:
    description: Deprecated. Verification is always required; this input is ignored.
    required: false
    default: 'false'
  kustomize_path:
    description: Optional kustomize path to apply before rollout.
    required: false
    default: ''
  statefulset_name:
    description: Optional StatefulSet to update and roll out.
    required: false
    default: ''
  statefulset_container:
    description: Optional StatefulSet container name. Defaults to statefulset_name.
    required: false
    default: ''
  statefulset_image:
    description: Image to set on the optional StatefulSet.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Apply Kustomize
      if: ${{ inputs.kustomize_path != '' }}
      shell: bash
      env:
        KUSTOMIZE_PATH: ${{ inputs.kustomize_path }}
        OPENSHIFT_NAMESPACE: ${{ inputs.namespace }}
      run: oc apply -k "${KUSTOMIZE_PATH}" -n "${OPENSHIFT_NAMESPACE}"

    - name: Update StatefulSet without overlapping instances
      if: ${{ inputs.statefulset_name != '' }}
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
        NAME: ${{ inputs.statefulset_name }}
        CONTAINER: ${{ inputs.statefulset_container || inputs.statefulset_name }}
        IMAGE: ${{ inputs.statefulset_image }}
        TIMEOUT: ${{ inputs.rollout_timeout }}
      run: bash openshift/scripts/release/rollout.sh "$NAMESPACE" statefulset "$NAME" "$TIMEOUT" "$IMAGE" "$CONTAINER"

    - name: Roll out and verify workload
      shell: bash
      env:
        NAMESPACE: ${{ inputs.namespace }}
        KIND: ${{ inputs.resource_type }}
        NAME: ${{ inputs.resource_name }}
        TIMEOUT: ${{ inputs.rollout_timeout }}
      run: bash openshift/scripts/release/rollout.sh "$NAMESPACE" "$KIND" "$NAME" "$TIMEOUT"
