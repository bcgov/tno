# Scaffold: DEV has no Elasticsearch Cloud cluster yet. Before scaling it up, set ELASTICSEARCH_URI
# below and create the elastic-cloud Secret (ApiKey) in 9b301c-dev.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: 9b301c-dev

resources:
  - ../../base

components:
  - ../../components/cloud

generatorOptions:
  disableNameSuffixHash: true

patches:
  - target:
      kind: ConfigMap
      name: indexing-service
    patch: |-
      - op: replace
        path: /data/ELASTICSEARCH_URI
        value: https://SET-DEV-CLOUD-URL.es.ca-central-1.aws.elastic-cloud.com
  - target:
      kind: Deployment
      name: indexing-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 100m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 80Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 200m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 250Mi
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: bcgov-c4awhwfpcremdbga.azurecr.io/indexing-service:dev
