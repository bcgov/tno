name: Bash command validation
on:
  pull_request:
    paths: ['do', 'src/tools/scripts/**', 'dependencies/kafka/scripts/**', 'openshift/scripts/**', '.github/workflows/do-validation.yml']
  push:
    branches: [main, dev, master]
    paths: ['do', 'src/tools/scripts/**', 'dependencies/kafka/scripts/**', 'openshift/scripts/**', '.github/workflows/do-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  commands:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Use system Bash on macOS (3.2 compatibility)
        if: runner.os == 'macOS'
        run: echo /bin >> "$GITHUB_PATH"
      - name: Select Git Bash for Python subprocesses on Windows
        if: runner.os == 'Windows'
        run: echo "DO_TEST_BASH=$(cygpath -m /bin/bash.exe)" >> "$GITHUB_ENV"
      - name: Check Bash syntax and command behavior without services
        run: |
          bash --version
          bash -n do
          for script in src/tools/scripts/do/*.sh; do bash -n "$script"; done
          python3 -m unittest discover -s src/tools/scripts/tests -p 'test_do.py' -v
