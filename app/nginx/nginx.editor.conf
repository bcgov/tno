# Serves the editor design. Differs from the other design's config only in $design.
worker_processes auto;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mmi/http.conf;

  server {
    set $design _editor;
    include /etc/nginx/mmi/server.conf;
  }
}
