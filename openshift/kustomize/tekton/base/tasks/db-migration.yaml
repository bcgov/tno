apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: db-migration
  annotations:
    tekton.dev/displayName: Run Database Migration
    tekton.dev/pipelines.minVersion: 0.12.1
    tekton.dev/tags: docker
    description: This task runs the database migration.
  labels:
    component: task
    managed-by: kustomize
    name: db-migration
    part-of: tno
    version: 1.0.0
spec:
  params:
    - default: db-migration
      description: The name of the database migration image.
      name: IMAGE
      type: string
    - default: 9b301c
      description: The shortname of the project namespace.
      name: PROJECT_SHORTNAME
      type: string
    - default: latest
      description: The tag given to the built image.
      name: IMAGE_TAG
      type: string
    - default: dev
      description: Which environment to deploy to
      name: DEPLOY_TO
      type: string
    - default: montford
      description: The database server name
      name: SERVER
      type: string
  steps:
    - computeResources:
        requests:
          cpu: '1'
          memory: 2Gi
      image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
      name: run
      script: |-
        #!/usr/bin/env bash

        PROJECT=$(params.PROJECT_SHORTNAME)-$(params.DEPLOY_TO)

        IMAGE=image-registry.apps.silver.devops.gov.bc.ca/$(params.PROJECT_SHORTNAME)-tools/$(params.IMAGE):$(params.IMAGE_TAG)

        echo "Running database migration in $PROJECT"

        oc run $(params.IMAGE) \
          -n $PROJECT \
          --image=$IMAGE \
          --image-pull-policy=Always \
          --attach \
          --rm \
          --restart=Never \
          --override-type='merge' \
          --overrides='{
            "apiVersion":"v1",
            "spec":{
              "containers":[
                {
                  "name":"$(params.IMAGE)",
                  "image":"image-registry.apps.silver.devops.gov.bc.ca/$(params.PROJECT_SHORTNAME)-tools/$(params.IMAGE):$(params.IMAGE_TAG)",
                  "env":[
                    {
                      "name":"ConnectionStrings__TNO",
                      "valueFrom":{
                        "configMapKeyRef":{
                          "name":"api",
                          "key":"CONNECTION_STRING"
                        }
                      }
                    },
                    {
                      "name":"DB_POSTGRES_USERNAME",
                      "valueFrom":{
                        "secretKeyRef":{
                          "name":"$(params.SERVER)",
                          "key":"USERNAME"
                        }
                      }
                    },
                    {
                      "name":"DB_POSTGRES_PASSWORD",
                      "valueFrom":{
                        "secretKeyRef":{
                          "name":"$(params.SERVER)",
                          "key":"PASSWORD"
                        }
                      }
                    }
                  ],
                  "labels":{
                    "role":"migration","part-of":"tno","component":"database"
                    },
                  "resources":{
                    "requests":{
                      "memory":"1Gi",
                      "cpu":"500m"
                    }
                  }
                }
              ]
            }
          }'
      securityContext:
        capabilities:
          add:
            - SETFCAP
