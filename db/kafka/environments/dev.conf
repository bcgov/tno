# Kafka topic settings for OpenShift dev (cd openshift; make kafka-update e=dev).
# Variables exported before running, or command line options, override these.
KAFKA_TARGET=openshift
KAFKA_NAMESPACE=9b301c-dev
KAFKA_BROKER_POD=kafka-broker-0
# The INTERNAL listener, as seen from inside the broker pod.
KAFKA_BOOTSTRAP=kafka-headless:29092
# Partitions cap how many instances of a service consume a topic in parallel. Matches the brokers'
# KAFKA_NUM_PARTITIONS; the replication factor needs at least that many brokers (there are 4).
KAFKA_PARTITIONS=6
KAFKA_REPLICATION_FACTOR=3

# Configuration applied to every topic (comma-separated key=value), e.g. min.insync.replicas=2
# KAFKA_TOPIC_CONFIG=

# Per-topic overrides (topic upper-cased, '-' and '.' become '_'):
# KAFKA_TOPIC_ANALYSIS_PARTITIONS=12
# KAFKA_TOPIC_ANALYSIS_DLQ_CONFIG=retention.ms=2592000000
