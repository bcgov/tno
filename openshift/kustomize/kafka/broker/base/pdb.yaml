---
# Stops a voluntary disruption (node drain during cluster maintenance) from taking a second broker
# while another is still unavailable. The brokers run KRaft in combined broker+controller mode with
# 4 voters, so losing 2 at once loses the controller quorum.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kafka-broker
  labels:
    name: kafka-broker
    part-of: tno
    version: 1.0.0
    component: kafka-broker
    managed-by: kustomize
    created-by: jeremy.foster
spec:
  selector:
    matchLabels:
      statefulset: kafka-broker-cluster
  maxUnavailable: 1
