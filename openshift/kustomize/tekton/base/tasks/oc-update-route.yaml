apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: oc-update-route
  annotations:
    tekton.dev/displayName: openshift client
    tekton.dev/pipelines.minVersion: 0.12.1
    tekton.dev/tags: cli
  labels:
    app.kubernetes.io/version: '0.1'
    operator.tekton.dev/provider-type: redhat
spec:
  description: This task uses oc cli to update a route and point it to the specified service.
  params:
    - default: 9b301c-dev
      description: The project namespace.
      name: PROJECT_NAMESPACE
      type: string
    - description: The name of the route to update.
      name: ROUTE
      type: string
    - description: The name of the service to point the route to.
      name: SERVICE
      type: string
  steps:
    - computeResources: {}
      image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
      name: update-route
      script: |
        set -e echo "Pointing route '$(params.ROUTE)' to '$(params.SERVICE)' in $(params.PROJECT_NAMESPACE)"

        oc patch route/$(params.ROUTE) -n $(params.PROJECT_NAMESPACE) -p '{"spec":{"to":{"name":"$(params.SERVICE)"}}}'
